services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [backend]

  qdrant:
    image: qdrant/qdrant:v1.14.3
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [backend]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./security/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    networks: [backend]

  vllm:
    image: vllm/vllm-openai:latest
    profiles: [gpu]
    command: >-
      --model ${MODEL_NAME}
      --host 0.0.0.0
      --port 8000
      --served-model-name enterprise-model
      --enable-prefix-caching
      --max-model-len 8192
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8001:8000"
    ipc: host
    networks: [backend]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: ${MINIO_SECURE}
      LLM_MODE: ${LLM_MODE}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      MODEL_NAME: ${MODEL_NAME}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      MAX_CONTEXT_CHUNKS: ${MAX_CONTEXT_CHUNKS}
      MAX_HISTORY_MESSAGES: ${MAX_HISTORY_MESSAGES}
      AUTH_MODE: ${AUTH_MODE}
      DEV_USER_ID: ${DEV_USER_ID}
      DEV_USER_NAME: ${DEV_USER_NAME}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL}
      OIDC_ISSUER: ${OIDC_ISSUER}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - hf_sentence_cache:/root/.cache/huggingface
      - ./models:/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    networks: [backend]

  web:
    build: ./apps/web
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: enterprise
      VITE_KEYCLOAK_CLIENT_ID: enterprise-web
    ports:
      - "5173:5173"
    depends_on: [api]
    networks: [backend]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  hf_cache:
  hf_sentence_cache:

networks:
  backend:
